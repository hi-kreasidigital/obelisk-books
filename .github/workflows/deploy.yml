name: Build and deploy

# Builds on every push to main and deploys to Cloudflare Workers (static assets).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Also runs on `repository_dispatch: publish` so the dashboard's "Publish site" button can trigger a rebuild (Phase 3).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [publish]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Preview upload for pull requests
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler versions upload --preview-alias pr-${{ github.event.number }}
